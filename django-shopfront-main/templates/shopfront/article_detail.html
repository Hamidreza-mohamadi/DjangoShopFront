{% extends 'shopfront/base.html' %}{% block title %}{{ article.title }} | فروشگاه{% endblock %}{% block content %}<article class="container-shop page-wrap" dir="rtl" style="max-width:900px"><p class="muted">{{ article.pub_date|date:'Y/m/d' }}</p><h1 style="font-size:32px;margin:8px 0 24px">{{ article.title }}</h1>{% if article.image %}<img src="{{ article.image.url|default:article.image }}" alt="{{ article.title }}" style="width:100%;max-height:460px;object-fit:cover;border-radius:16px;margin-bottom:24px">{% endif %}<div style="line-height:2.2;font-size:16px">{{ article.content|linebreaks }}</div></article>{% endblock %}
