{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}فروشگاه | خرید آنلاین محصولات{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}فروشگاه آنلاین با تجربه خرید ساده و مدرن.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'shopfront/css/theme.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="site-shell">
    {% include 'shopfront/partials/header.html' %}
    <main class="site-main">{% block content %}{% endblock %}</main>
    {% include 'shopfront/partials/footer.html' %}
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{% static 'shopfront/js/theme.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
