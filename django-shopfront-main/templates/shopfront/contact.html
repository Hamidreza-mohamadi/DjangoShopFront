{% extends 'shopfront/base.html' %}{% block title %}ارتباط با ما | فروشگاه آنلاین{% endblock %}{% block content %}<div class="container-shop page-wrap" dir="rtl"><h1 style="font-size:30px">ارتباط با ما</h1><div style="display:grid;grid-template-columns:2fr 1fr;gap:32px;margin-top:24px"><form method="post" class="panel" style="padding:24px">{% csrf_token %}<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><label>نام<input class="field" name="name" required></label><label>ایمیل<input class="field" type="email" name="email" required></label></div><label style="display:block;margin-top:16px">پیام<textarea class="field" name="message" rows="6" required></textarea></label><button class="btn btn-primary" type="submit" style="margin-top:16px">ارسال پیام</button></form><aside class="panel" style="padding:24px;height:max-content"><h2 style="font-size:18px;margin-top:0">{{ site_setting.site_name }}</h2><p class="muted">{{ site_setting.address }}</p><p>{{ site_setting.phone }}</p><p>{{ site_setting.fax }}</p><p>{{ site_setting.email }}</p></aside></div></div>{% endblock %}
